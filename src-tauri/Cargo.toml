[package]
name = "kestrel"
version = "0.1.0"
description = "An open-source, Linux-first agent workbench for the desktop."
authors = ["Kestrel contributors"]
license = "MIT"
repository = "https://github.com/mhzsajan/kestrel"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kestrel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
dirs = "5"
walkdir = "2"
regex = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
